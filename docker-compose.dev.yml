version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: opensquad-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: opensquad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensquad_secret}
      POSTGRES_DB: opensquad
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensquad"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opensquad-dev

  redis:
    image: redis:7-alpine
    container_name: opensquad-redis-dev
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --appendonly yes
    volumes:
      - redis_data_dev:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opensquad-dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "if [ ! -x node_modules/.bin/tsx ] || [ ! -d node_modules/@fastify/multipart ]; then npm ci; fi && npx prisma generate && npm run dev"
    container_name: opensquad-backend-dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://opensquad:${POSTGRES_PASSWORD:-opensquad_secret}@postgres:5432/opensquad
      REDIS_URL: redis://redis:6379
      PORT: 3001
      NODE_ENV: development
      JWT_SECRET: dev_jwt_secret_change_in_production_at_least_32_chars
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret_change_in_production
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opensquad-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: sh -c "if [ ! -x node_modules/.bin/next ]; then npm ci; fi && npm run dev -- --hostname 0.0.0.0"
    container_name: opensquad-frontend-dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - opensquad-dev

networks:
  opensquad-dev:
    driver: bridge

volumes:
  postgres_data_dev:
  redis_data_dev:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
